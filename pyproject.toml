[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sesy"
version = "0.1.0"
description = "Python SDK for SESY email service"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Deni Bertovic" }
]
keywords = ["email", "ses", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# `uv sync` installs the dev group by default but never installs extras on
# its own, so the group points back at the extra to keep one list of tools.
[dependency-groups]
dev = ["sesy[dev]"]

[project.urls]
Homepage = "https://sesy.email"
Documentation = "https://sesy.email/docs"
Source = "https://github.com/denibertovic/sesy-python"
Tracker = "https://github.com/denibertovic/sesy-python/issues"

[tool.hatch.build.targets.sdist]
include = ["/sesy"]

[tool.hatch.build.targets.wheel]
packages = ["sesy"]

[tool.ruff]
line-length = 88
target-version = "py39"
# Code blocks in the README are illustrative, not a formatting target.
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
